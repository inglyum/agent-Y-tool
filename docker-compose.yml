services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ingly
      POSTGRES_USER: ingly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?imposta POSTGRES_PASSWORD in .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingly -d ingly"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    environment:
      INGLY_DATABASE_URL: postgresql://ingly:${POSTGRES_PASSWORD}@db:5432/ingly
    depends_on: { db: { condition: service_healthy } }
    command: ["sh", "-c", "python -m ingly migrate && python -m ingly serve --host 0.0.0.0 --port 8000"]
    ports: ["127.0.0.1:8000:8000"]   # esporre solo dietro un reverse proxy HTTPS
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      INGLY_DATABASE_URL: postgresql://ingly:${POSTGRES_PASSWORD}@db:5432/ingly
    depends_on: { db: { condition: service_healthy } }
    command: ["python", "-m", "ingly", "worker"]
    restart: unless-stopped
volumes:
  pgdata:
